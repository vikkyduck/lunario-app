<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 360" width="200" height="360">
  <!-- Рубашка карты дня: ночь, тонкая золотая линия, полумесяц со свечением. Одна техника с иконками и знаками зодиака -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241c47"/><stop offset=".55" stop-color="#141126"/><stop offset="1" stop-color="#0b0a14"/></linearGradient>
    <radialGradient id="h" cx=".5" cy=".46" r=".5"><stop offset="0" stop-color="#f0d79a" stop-opacity=".22"/><stop offset=".5" stop-color="#f0d79a" stop-opacity=".06"/><stop offset="1" stop-color="#f0d79a" stop-opacity="0"/></radialGradient>
    <filter id="b" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="s4" d="M0-5C.6-1.6 1.6-.6 5 0 1.6.6.6 1.6 0 5-.6 1.6-1.6.6-5 0-1.6-.6-.6-1.6 0-5Z"/>
  </defs>
  <rect width="200" height="360" rx="16" fill="url(#g)"/>
  <rect width="200" height="360" rx="16" fill="url(#h)"/>
  <g fill="none" stroke="#e6c987" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="7" width="186" height="346" rx="12" stroke-opacity=".55" stroke-width="1.2"/>
    <rect x="15" y="15" width="170" height="330" rx="8" stroke-opacity=".28" stroke-width=".8"/>
    <!-- угловые знаки -->
    <g stroke-opacity=".7" stroke-width=".9">
      <path d="M26 30l4-4 4 4-4 4zM166 30l4-4 4 4-4 4zM26 330l4-4 4 4-4 4zM166 330l4-4 4 4-4 4z"/>
      <path d="M22 44v-14h14M178 44v-14h-14M22 316v14h14M178 316v14h-14" stroke-opacity=".4"/>
    </g>
    <!-- орбита -->
    <circle cx="100" cy="166" r="62" stroke-opacity=".45" stroke-width=".9" stroke-dasharray="1 5"/>
    <circle cx="100" cy="166" r="78" stroke-opacity=".18" stroke-width=".7"/>
    <!-- лучи-линии сверху и снизу -->
    <path d="M100 52v22M100 258v22M60 166H40M160 166h20" stroke-opacity=".35" stroke-width=".8"/>
  </g>
  <!-- полумесяц: свечение и линия -->
  <g transform="translate(100 166)">
    <path d="M14-40A42 42 0 1 0 14 40A34 34 0 1 1 14-40Z" fill="#f0d79a" fill-opacity=".35" filter="url(#b)"/>
    <path d="M14-40A42 42 0 1 0 14 40A34 34 0 1 1 14-40Z" fill="none" stroke="#f0d79a" stroke-width="1.4" stroke-opacity=".95"/>
    <path d="M14-40A42 42 0 1 0 14 40" fill="none" stroke="#fff6dd" stroke-width=".6" stroke-opacity=".6"/>
    <use href="#s4" transform="translate(34 -22) scale(1.2)" fill="#f0d79a"/>
    <use href="#s4" transform="translate(44 6) scale(.7)" fill="#f0d79a" fill-opacity=".8"/>
  </g>
  <!-- звёзды по полю -->
  <g fill="#f0d79a">
    <circle cx="48" cy="92" r="1.2" fill-opacity=".8"/><circle cx="150" cy="246" r="1.2" fill-opacity=".8"/><circle cx="62" cy="262" r=".9" fill-opacity=".6"/>
    <circle cx="146" cy="84" r=".9" fill-opacity=".6"/><circle cx="34" cy="180" r=".8" fill-opacity=".5"/><circle cx="168" cy="150" r=".8" fill-opacity=".5"/>
    <use href="#s4" transform="translate(100 40) scale(.8)" fill-opacity=".9"/>
    <use href="#s4" transform="translate(100 320) scale(.8)" fill-opacity=".9"/>
  </g>
</svg>
