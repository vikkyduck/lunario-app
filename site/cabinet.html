<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лунарио — кабинет</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/app/assets/favicon.svg?v=3" type="image/svg+xml">
<style>
@font-face{font-family:'Onest';font-style:normal;font-weight:100 900;font-display:swap;src:url('/app/assets/fonts/onest-400-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:100 900;font-display:swap;src:url('/app/assets/fonts/onest-400-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Comfortaa';font-style:normal;font-weight:300 700;font-display:swap;src:url('/app/assets/fonts/comfortaa-300-700-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Comfortaa';font-style:normal;font-weight:300 700;font-display:swap;src:url('/app/assets/fonts/comfortaa-300-700-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Тёмно-фиолетовый фон, яркий светлый текст, крупные кегли и никакого тонкого начертания — чтобы читалось и при астигматизме. */
:root{--bg:#0b0a14;--text:#f7f4ee;--muted:#cfc8e4;--faint:#a49cc2;--line:rgba(245,242,234,.14);--gold:#e0c070;--gold-2:#f3dca0;--ok:#a8ecc6;--warn:#ffb8b8;--blue:#a9b8ff;
  --card:linear-gradient(135deg,rgba(245,242,234,.09) 0%,rgba(245,242,234,.04) 45%,rgba(245,242,234,.06) 100%),linear-gradient(rgba(22,18,42,.9),rgba(22,18,42,.9));
  --shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 34px -14px rgba(0,0,0,.6);--sp:cubic-bezier(.2,.85,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Onest,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(180deg,#171330 0%,#0b0a14 70%);background-attachment:fixed;min-height:100dvh;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--gold-2)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;color:#fff}
h1{font-size:30px;line-height:1.15}h2{font-size:21px;line-height:1.25}h3{font-size:17px}
p{margin:0;color:var(--muted)}
.wordmark{font-family:Comfortaa,ui-rounded,Onest,sans-serif;font-weight:400;font-size:22px;color:var(--text);letter-spacing:.01em}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:800;color:var(--gold);display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 15%;border-bottom:1px solid var(--line)}
.top .who{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.wrap{padding:0 15% 60px}
@media(max-width:1100px){.top{padding:14px 4%}.wrap{padding:0 4% 48px}}
@media(max-width:700px){.top{padding:10px 14px}.wrap{padding:0 14px 40px}.wordmark{font-size:17px}.top .who{font-size:13px;gap:8px}.top .who .btn{min-height:32px;padding:0 10px;font-size:13px}h1{font-size:25px;overflow-wrap:anywhere}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:rgba(224,192,112,.6)}
.btn.gold{border:0;background:linear-gradient(135deg,#f3dca0 0%,#e0c070 55%,#bf9440 100%);color:#1c1430;box-shadow:0 12px 34px rgba(224,192,112,.25)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px}
.btn.warn{color:var(--warn)}
.btn.on{background:rgba(224,192,112,.18);border-color:rgba(224,192,112,.6)}
.btn[disabled]{opacity:.45}
input,select,textarea{width:100%;min-height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);padding:10px 14px;color:#fff;font:inherit;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#e0c070}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#cfc8e4 50%),linear-gradient(135deg,#cfc8e4 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select option{background:#1d1738;color:#fff}
textarea{min-height:360px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px;line-height:1.55;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.view{display:none}.view.on{display:block}
.login{max-width:460px;margin:60px auto}
.msg{font-size:15px;margin-top:10px;min-height:1px}.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.hint{font-size:14px;color:var(--faint);margin-top:8px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}.row .fixed{flex:0 0 auto;min-width:0}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-16px);z-index:60;background:rgba(29,23,56,.96);border:1px solid rgba(224,192,112,.45);padding:11px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.3s var(--sp);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock{font-size:13.5px;color:var(--faint)}
/* ── роли: статичный экран, 6 квадратов на десктопе, 3 на планшете, 2 на телефоне ── */
.roles{padding:14px 0 0}
.team{margin-top:14px}
.team .scroll{max-height:calc(100dvh - 470px);min-height:180px;overflow:auto}
@media(max-width:1100px){.team .scroll{max-height:none}}
.roles-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.role{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:24px;background:var(--card);border:1px solid rgba(224,192,112,.38);box-shadow:var(--shadow),0 14px 36px -18px rgba(224,192,112,.45);color:var(--text);font:inherit;font-size:clamp(15px,1.25vw,19px);font-weight:700;cursor:pointer;text-decoration:none;text-align:center;padding:10px;transition:transform .16s var(--sp),border-color .2s}
.role:hover{border-color:rgba(224,192,112,.75)}.role:active{transform:scale(.97)}
.role small{font-size:13px;font-weight:500;color:var(--faint);line-height:1.3}
.role .ico{width:34px;height:34px;background:var(--gold);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.role.off{opacity:.3;pointer-events:none;border-color:var(--line);box-shadow:none}
@media(max-width:1100px){.roles-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.roles-grid{grid-template-columns:1fr 1fr;gap:12px}.roles{padding:12px 0 0}.role{border-radius:20px;font-size:16px}}
/* ── кабинет: меню слева, отчёт справа ── */
.cab{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;padding-top:20px}
.cab>*{min-width:0}
#report{min-width:0}
.menu{position:sticky;top:14px;align-self:start;display:flex;flex-direction:column;gap:4px}
.menu a{display:block;padding:9px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:600;border:1px solid transparent}
.menu a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.menu a.on{color:var(--text);background:rgba(224,192,112,.14);border-color:rgba(224,192,112,.5)}
.menu .back{margin-bottom:8px}
.menu .cfg{margin-top:10px;color:var(--gold-2);border:1px dashed rgba(224,192,112,.45)}
.cfg-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cfg-item{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.cfg-item b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-item .btn.sm{min-height:30px;padding:0 9px;font-size:13px}
.cfg-item details{grid-column:1/-1}.cfg-item summary{cursor:pointer;color:var(--faint);font-size:13px;list-style:none}
.cfg-item details input{margin-top:6px;min-height:38px;font-size:14.5px}
.cfg-sec{margin-top:18px}.cfg-sec h3{margin-bottom:4px}
@media(max-width:1000px){.cab{grid-template-columns:1fr;gap:14px}.menu{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:6px;-webkit-overflow-scrolling:touch}.menu a{white-space:nowrap;padding:8px 12px;border:1px solid var(--line)}.menu .back{margin:0}}
.back{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:#f3dca0;background:none;border:0;padding:8px 0;cursor:pointer;font:inherit;font-weight:600}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.periods{display:flex;gap:6px;flex-wrap:wrap}
.periods button{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.periods button.on{background:rgba(224,192,112,.18);border-color:rgba(224,192,112,.6);color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--faint);min-width:150px}
.filters select,.filters input{min-height:38px;padding:6px 32px 6px 12px;font-size:14.5px;border-radius:10px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
@media(max-width:1300px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.kpis{gap:8px}.kpi{min-height:110px;padding:12px}.kpi .val{font-size:26px}}
.kpi{display:flex;flex-direction:column;gap:5px;min-height:126px;padding:16px 16px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi b{font-size:15px;line-height:1.3;color:var(--text)}
.kpi .val{font-size:34px;font-weight:750;line-height:1.05;color:var(--gold-2);margin-top:auto;font-variant-numeric:tabular-nums}
.kpi .val .unit{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px}
.kpi .val.na{font-size:18px;color:var(--faint);font-weight:600}
.kpi .cmp,.kpi .sub{font-size:13.5px;color:var(--faint);line-height:1.35}
.up{color:var(--ok)}.down{color:var(--warn)}
.state{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.state.off{border-color:rgba(255,184,184,.4);color:var(--warn)}
/* блоки сводки */
.north{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;padding:18px 22px;border-radius:22px;background:linear-gradient(135deg,rgba(224,192,112,.16),rgba(224,192,112,.05));border:1px solid rgba(224,192,112,.55);cursor:pointer;color:inherit;font:inherit;text-align:left;width:100%}
.north>div:first-child{flex:0 0 auto}.north .val{font-size:44px;font-weight:800;color:var(--gold-2);line-height:1}
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media(max-width:1300px){.blocks{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.blocks{grid-template-columns:1fr}}
.block{display:flex;flex-direction:column;gap:6px;min-height:176px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:border-color .2s}
.block:hover{border-color:rgba(224,192,112,.6)}.block.main{border-color:rgba(224,192,112,.55)}.block.alarm .val{color:var(--warn)}
.block b{font-size:15px;line-height:1.3}
.block .val{font-size:32px;font-weight:750;line-height:1;color:var(--gold-2);margin-top:auto;font-variant-numeric:tabular-nums}
.block .val .unit{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:6px}
.block .cmp,.block .sub{font-size:13.5px;color:var(--faint);line-height:1.35}
.block .go{font-size:13px;color:var(--gold-2);font-weight:600}
.spark{height:32px;width:100%}
/* диаграммы */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.viz{min-width:0;overflow:hidden;padding:18px 18px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.viz h3{font-size:17px}.viz .sub{font-size:13.5px;color:var(--faint);margin-top:2px}
.viz .insight{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted);line-height:1.45}
.viz svg{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}
.viz svg text{font-family:inherit;font-size:15px;fill:#d9d3ea;font-weight:600}
.legend{display:flex;flex-direction:column;gap:4px;font-size:14.5px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:8px}.legend i{width:12px;height:12px;border-radius:3px;flex:0 0 auto}.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.pie{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:480px){.pie{grid-template-columns:1fr}.pie svg{max-width:170px;margin:0 auto}}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hbars .l{display:flex;justify-content:space-between;font-size:14.5px}.hbars .l b{font-variant-numeric:tabular-nums}
.hbars .t{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}.hbars .t i{display:block;height:100%;background:linear-gradient(90deg,#f3dca0,#bf9440);border-radius:6px}
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.funnel div{padding:9px 12px;border-radius:10px;background:linear-gradient(90deg,rgba(224,192,112,.4),rgba(224,192,112,.18));border:1px solid rgba(224,192,112,.35);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:36%}
.funnel div b{font-variant-numeric:tabular-nums;margin-right:6px}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;margin-top:12px;font-size:11px}
.heat span{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:3px;background:rgba(224,192,112,var(--a,.04));color:transparent}
.heat .lab{background:none;color:var(--faint);aspect-ratio:auto;justify-content:flex-start}
.empty{padding:14px;font-size:14.5px;color:var(--faint)}
/* таблицы */
.tbl{margin-top:18px}
.tbl h3{margin-bottom:2px}
.tbl .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
th{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--faint);font-size:13px}
.note{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.45}
.how{margin-top:20px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.045);border:1px dashed var(--line);font-size:15px;color:var(--muted);line-height:1.5}
.how b{color:var(--text)}
.notice{margin-top:14px;padding:12px 16px;border-radius:14px;background:rgba(169,184,255,.09);border:1px solid rgba(169,184,255,.35);font-size:14.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.chip.on{background:rgba(224,192,112,.18);border-color:rgba(224,192,112,.6);color:var(--text)}
.chip input{width:auto;min-height:0;margin:0;accent-color:#e0c070}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid rgba(224,192,112,.4);font-size:13px;color:var(--text);margin:1px 2px 1px 0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(11,10,20,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .card{width:min(760px,100%);max-height:90dvh;overflow:auto;background:#1b1637}
.files{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(max-width:700px){.files{grid-template-columns:1fr}}
.file{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;color:inherit;font:inherit;text-align:left}
.file:hover{border-color:rgba(224,192,112,.6)}
.file small{color:var(--faint);font-size:13px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:44dvh;overflow:auto;margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.thread .m{max-width:82%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.thread .m.user{align-self:flex-start;background:rgba(255,255,255,.08)}
.thread .m.support{align-self:flex-end;background:rgba(224,192,112,.18);border:1px solid rgba(224,192,112,.35)}
.thread .m small{display:block;color:var(--faint);font-size:12px;margin-bottom:3px}
@media(max-width:700px){
  .staff-tbl{table-layout:fixed;width:100%}
  .staff-tbl th,.staff-tbl td{white-space:normal;word-break:break-word;overflow-wrap:anywhere;padding:8px 6px;font-size:13.5px}
  .staff-tbl th:nth-child(1),.staff-tbl td:nth-child(1){width:19%}
  .staff-tbl th:nth-child(2),.staff-tbl td:nth-child(2){width:23%}
  .staff-tbl th:nth-child(3),.staff-tbl td:nth-child(3){width:31%}
  .staff-tbl th:nth-child(4),.staff-tbl td:nth-child(4){width:27%}
  .staff-tbl th,.staff-tbl td{padding:8px 3px}
  .staff-tbl td:nth-child(4){text-align:right}
  .staff-tbl .btn.sm{width:100%;margin:2px 0;padding:0 6px;font-size:12.5px}
  .staff-tbl .lock{white-space:nowrap}
}
</style>
</head>
<body>
<header class="top">
  <a class="wordmark" href="/app/cabinet" style="text-decoration:none">Лунарио · кабинет</a>
  <div class="who" id="who"></div>
</header>

<main class="wrap">
  <section class="view login" id="v-login">
    <span class="eyebrow">Вход в кабинет</span>
    <h1 style="margin-top:8px">По рабочей почте</h1>
    <p style="margin-top:10px">Пришлём шестизначный код. Кабинеты открываются по почте: у каждого — свои разделы.</p>
    <div class="card" style="margin-top:20px" id="l-box"></div>
  </section>

  <section class="view" id="v-home">
    <div class="roles">
      <div class="roles-grid" id="roles"></div>
    </div>
    <section class="team" id="team"></section>
  </section>

  <section class="view" id="v-cab">
    <div class="cab">
      <nav class="menu" id="menu"></nav>
      <div id="report"></div>
    </div>
  </section>
