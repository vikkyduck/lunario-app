# Проверки перед выпуском — ровно те же, что запускает deploy.sh: один runner tools/check-all.mjs (аудит v98, F21).
# Без Playwright, без секретов, без настоящих данных: check-personal-features поднимает настоящий сервер во временной папке.
name: Проверки
on:
  push:
    branches: [main, desktop]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Playwright — регрессии в браузере входят в обязательный набор (аудит v112, R15)
        run: npm ci && npx playwright install --with-deps chromium
      - name: Один набор проверок — тот же, что перед выпуском (tools/check-all.mjs)
        run: node tools/check-all.mjs
